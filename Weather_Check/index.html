<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="weather-card">
            <h1>🌤️ Weather Dashboard</h1>
            <p class="subtitle">Search current weather conditions by city</p>

            <form id="weatherForm" class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name..."
                    aria-label="City name"
                    autocomplete="off"
                >
                <button type="submit">Search</button>
            </form>

            <p id="errorMessage" class="error" role="alert"></p>
            <p id="loading" class="loading">Loading weather...</p>

            <section id="weatherResult" class="weather-result">
                <div class="location">
                    <h2 id="cityName">--</h2>
                    <p id="date">--</p>
                </div>

                <div class="main-weather">
                    <img id="weatherIcon" src="" alt="Weather icon">
                    <div>
                        <p id="temperature" class="temperature">--°C</p>
                        <p id="condition">--</p>
                    </div>
                </div>

                <div class="details">
                    <div class="detail-card">
                        <span>💧</span>
                        <p>Humidity</p>
                        <strong id="humidity">--%</strong>
                    </div>
                    <div class="detail-card">
                        <span>💨</span>
                        <p>Wind Speed</p>
                        <strong id="wind">-- m/s</strong>
                    </div>
                    <div class="detail-card">
                        <span>🌡️</span>
                        <p>Feels Like</p>
                        <strong id="feelsLike">--°C</strong>
                    </div>
                    <div class="detail-card">
                        <span>👁️</span>
                        <p>Visibility</p>
                        <strong id="visibility">-- km</strong>
                    </div>
                </div>
            </section>

            <p class="hint">Try cities such as Chennai, Bengaluru, Mumbai or Delhi.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
