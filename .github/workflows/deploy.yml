name: Deploy Movie Explorer

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: movie_explorer/package-lock.json

      - name: Install dependencies
        working-directory: movie_explorer
        run: npm ci

      - name: Build
        working-directory: movie_explorer
        run: npm run build

      - name: Prepare site
        run: |
          mkdir -p site/movie_explorer
          cp -r movie_explorer/dist/* site/movie_explorer/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4